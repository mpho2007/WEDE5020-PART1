<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enquiry | Apex Auto Repair</title>
     <link rel="stylesheet" href="css\Style.css">
</head>

<body>

    <header>
        <div class="logo">
            <h1>Apex Auto Repair</h1>
            <p>Reliable Car Repairs You Can Trust</p>
        </div>

        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="aboutus.html">About Us</a></li>
                <li><a href="services.html">Services</a></li>
                <li><a href="gallery.html">Gallery</a></li>
                <li><a href="enquiry.html">Enquiry</a></li>
                <li><a href="contactus.html">Contact Us</a></li>
            </ul>
        </nav>
    </header>

    <main>

        <section class="page-header">
            <h2>Make an Enquiry</h2>
            <p>Send us your vehicle service or repair enquiry.</p>
        </section>

        <section class="form-section">

            <form action="#" method="post">

                <label for="name">Full Name</label>
                <input type="text" id="name" name="name" required>

                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" required>

                <label for="phone">Phone Number</label>
                <input type="tel" id="phone" name="phone">

                <label for="vehicle">Vehicle Make and Model</label>
                <input type="text" id="vehicle" name="vehicle">

                <label for="service">Service Required</label>

                <select id="service" name="service">
                    <option value="">Select a service</option>
                    <option value="servicing">Vehicle Servicing</option>
                    <option value="engine">Engine Repairs</option>
                    <option value="brakes">Brake Repairs</option>
                    <option value="oil">Oil Change</option>
                    <option value="battery">Battery Services</option>
                    <option value="diagnostics">Diagnostics</option>
                </select>

                <label for="message">Message</label>
                <textarea id="message" name="message" rows="6"></textarea>

                <button type="submit">Submit Enquiry</button>

            </form>

        </section>

    </main>

    <footer>
        <p>&copy; 2026 Apex Auto Repair. All Rights Reserved.</p>
    </footer>

</body>
</html>
